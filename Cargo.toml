[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/meshcore-rs"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
chrono = "0.4"
dioxus = { version = "0.7", features = ["desktop"] }
dirs = "7"
futures = "0.3"
getrandom = "0.3"
meshcore-rs = "=0.2.0"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-serial = "5"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
unwrap_used = "deny"

[patch.crates-io]
meshcore-rs = { path = "vendor/meshcore-rs" }
