<!-- Hedgerow app icon: macOS master (Big Sur plate style) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A6B45"/>
      <stop offset="1" stop-color="#17492F"/>
    </linearGradient>
    <linearGradient id="back" gradientUnits="userSpaceOnUse" x1="0" y1="122.9" x2="0" y2="237.9">
      <stop offset="0" stop-color="#47A56B"/>
      <stop offset="1" stop-color="#2E7D4F"/>
    </linearGradient>
    <linearGradient id="front" gradientUnits="userSpaceOnUse" x1="0" y1="130.9" x2="0" y2="237.9">
      <stop offset="0" stop-color="#6CC48A"/>
      <stop offset="1" stop-color="#4FAE6E"/>
    </linearGradient>
    <linearGradient id="amber" gradientUnits="userSpaceOnUse" x1="0" y1="18.1" x2="0" y2="108.4">
      <stop offset="0" stop-color="#F8CB72"/>
      <stop offset="1" stop-color="#F2B544"/>
    </linearGradient>
    <filter id="plate-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="12" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
    </filter>
    <filter id="contact" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <!-- plate: 824 x 824 at (100, 100), corner radius 185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000" filter="url(#plate-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <!-- glyph spans about 75% of the plate width -->
  <g transform="translate(512 512) scale(2.78) translate(-128 -128)">
    <!-- shadow under the hedge -->
    <ellipse cx="128" cy="240.9" rx="92" ry="5" fill="#000000" fill-opacity="0.35" filter="url(#contact)"/>
    <!-- mast -->
    <rect x="123.5" y="65.5" width="9" height="71.4" fill="url(#back)"/>
    <!-- signal -->
    <g fill="url(#amber)" stroke="url(#amber)">
      <circle cx="128" cy="65.5" r="17.5" stroke="none"/>
      <g fill="none" stroke-width="9" stroke-linecap="round">
        <path d="M105.5 38.69 A35.0 35.0 0 0 0 105.5 92.31"/>
        <path d="M150.5 38.69 A35.0 35.0 0 0 1 150.5 92.31"/>
        <path d="M92 22.6 A56 56 0 0 0 92 108.4"/>
        <path d="M164 22.6 A56 56 0 0 1 164 108.4"/>
      </g>
    </g>
    <!-- back layer: darker crest -->
    <g fill="url(#back)">
      <path d="M24 169.5 H232 V215.9 a22 22 0 0 1 -22 22 H46 a22 22 0 0 1 -22 -22 Z"/>
      <circle cx="49" cy="170.9" r="32"/>
      <circle cx="128" cy="169.9" r="47.01"/>
      <circle cx="207" cy="170.9" r="32"/>
    </g>
    <!-- front layer: three lobes -->
    <g fill="url(#front)">
      <path d="M24 177.5 H232 V215.9 a22 22 0 0 1 -22 22 H46 a22 22 0 0 1 -22 -22 Z"/>
      <circle cx="49" cy="178.9" r="32"/>
      <circle cx="128" cy="177.9" r="47.01"/>
      <circle cx="207" cy="178.9" r="32"/>
    </g>
    <!-- leaf highlights -->
    <g fill="none" stroke="#8FD3A4" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8">
      <path d="M28.08 172.1 A22 22 0 0 1 38.67 159.47"/>
      <path d="M92.8 166.47 A37.01 37.01 0 0 1 110.63 145.23"/>
      <path d="M186.08 172.1 A22 22 0 0 1 196.67 159.47"/>
    </g>
  </g>
</svg>
