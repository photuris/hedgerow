<!-- Hedgerow app icon: macOS master (Big Sur plate style) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A6B45"/>
      <stop offset="1" stop-color="#17492F"/>
    </linearGradient>
    <linearGradient id="back" gradientUnits="userSpaceOnUse" x1="0" y1="94.1" x2="0" y2="209.1">
      <stop offset="0" stop-color="#47A56B"/>
      <stop offset="1" stop-color="#2E7D4F"/>
    </linearGradient>
    <linearGradient id="front" gradientUnits="userSpaceOnUse" x1="0" y1="102.1" x2="0" y2="209.1">
      <stop offset="0" stop-color="#6CC48A"/>
      <stop offset="1" stop-color="#4FAE6E"/>
    </linearGradient>
    <linearGradient id="amber" gradientUnits="userSpaceOnUse" x1="0" y1="46.9" x2="0" y2="118.81">
      <stop offset="0" stop-color="#F8CB72"/>
      <stop offset="1" stop-color="#F2B544"/>
    </linearGradient>
    <filter id="plate-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="12" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
    </filter>
    <filter id="contact" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <!-- plate: 824 x 824 at (100, 100), corner radius 185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000" filter="url(#plate-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <!-- glyph spans about 75% of the plate width -->
  <g transform="translate(512 512) scale(2.78) translate(-128 -128)">
    <!-- shadow under the hedge -->
    <ellipse cx="128" cy="212.1" rx="92" ry="5" fill="#000000" fill-opacity="0.35" filter="url(#contact)"/>
    <!-- signal -->
    <g fill="url(#amber)" stroke="url(#amber)">
      <circle cx="128" cy="85.1" r="10" stroke="none"/>
      <g fill="none" stroke-width="9" stroke-linecap="round">
        <path d="M111.29 65.19 A26 26 0 0 0 111.29 105.02"/>
        <path d="M144.71 65.19 A26 26 0 0 1 144.71 105.02"/>
        <path d="M99.72 51.4 A44 44 0 0 0 99.72 118.81"/>
        <path d="M156.28 51.4 A44 44 0 0 1 156.28 118.81"/>
      </g>
    </g>
    <!-- back layer: darker crest -->
    <g fill="url(#back)">
      <path d="M24 140.7 H232 V187.1 a22 22 0 0 1 -22 22 H46 a22 22 0 0 1 -22 -22 Z"/>
      <circle cx="49" cy="142.1" r="32"/>
      <circle cx="128" cy="141.11" r="47.01"/>
      <circle cx="207" cy="142.1" r="32"/>
    </g>
    <!-- front layer: three lobes -->
    <g fill="url(#front)">
      <path d="M24 148.7 H232 V187.1 a22 22 0 0 1 -22 22 H46 a22 22 0 0 1 -22 -22 Z"/>
      <circle cx="49" cy="150.1" r="32"/>
      <circle cx="128" cy="149.11" r="47.01"/>
      <circle cx="207" cy="150.1" r="32"/>
    </g>
    <!-- leaf highlights -->
    <g fill="none" stroke="#8FD3A4" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8">
      <path d="M28.08 143.3 A22 22 0 0 1 38.67 130.68"/>
      <path d="M92.8 137.67 A37.01 37.01 0 0 1 110.63 116.43"/>
      <path d="M186.08 143.3 A22 22 0 0 1 196.67 130.68"/>
    </g>
  </g>
</svg>
