<!-- Hedgerow app icon: small glyph for 16 to 32 px (Linux and Windows) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- mast -->
  <rect x="15" y="8" width="2" height="8" fill="#2E7D4F"/>
  <!-- signal: node and one arc on each side -->
  <g fill="#F2B544" stroke="#F2B544">
    <circle cx="16" cy="8" r="2" stroke="none"/>
    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M12.79 4.17 A5 5 0 0 0 12.79 11.83"/>
      <path d="M19.21 4.17 A5 5 0 0 1 19.21 11.83"/>
    </g>
  </g>
  <!-- back layer: darker crest -->
  <g fill="#2E7D4F">
    <path d="M4 20 H28 V28 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 Z"/>
    <circle cx="8" cy="20" r="4"/>
    <circle cx="16" cy="18" r="4"/>
    <circle cx="24" cy="20" r="4"/>
  </g>
  <!-- front layer: three lobes, centre tallest -->
  <g fill="#4FAE6E">
    <path d="M4 21 H28 V28 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 Z"/>
    <circle cx="8" cy="22" r="4"/>
    <circle cx="16" cy="20" r="4"/>
    <circle cx="24" cy="22" r="4"/>
  </g>
</svg>
