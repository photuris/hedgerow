<!-- Hedgerow app icon: small glyph for 16 to 32 px (Linux and Windows) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- signal: node and one arc on each side, behind the hedge -->
  <g fill="#F2B544" stroke="#F2B544">
    <circle cx="16" cy="10" r="2" stroke="none"/>
    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M11.5 4.64 A7 7 0 0 0 11.5 15.36"/>
      <path d="M20.5 4.64 A7 7 0 0 1 20.5 15.36"/>
    </g>
  </g>
  <!-- back layer: darker crest -->
  <g fill="#2E7D4F">
    <path d="M4 18 H28 V26 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 Z"/>
    <circle cx="8" cy="18" r="4"/>
    <circle cx="16" cy="16" r="4"/>
    <circle cx="24" cy="18" r="4"/>
  </g>
  <!-- front layer: three lobes, centre tallest -->
  <g fill="#4FAE6E">
    <path d="M4 19 H28 V26 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 Z"/>
    <circle cx="8" cy="20" r="4"/>
    <circle cx="16" cy="18" r="4"/>
    <circle cx="24" cy="20" r="4"/>
  </g>
</svg>
