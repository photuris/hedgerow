<!-- Hedgerow app icon: small glyph for 16 to 32 px (Linux and Windows) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- back layer: darker lobes peeking into the notches -->
  <g fill="#2E7D4F">
    <path d="M4 20 H28 V26 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 Z"/>
    <circle cx="12" cy="18" r="4"/>
    <circle cx="20" cy="18" r="4"/>
  </g>
  <!-- front layer: three scallops -->
  <g fill="#4FAE6E">
    <path d="M4 20 H28 V26 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 Z"/>
    <circle cx="8" cy="20" r="4"/>
    <circle cx="16" cy="18" r="4"/>
    <circle cx="24" cy="20" r="4"/>
  </g>
  <!-- signal -->
  <g fill="#F2B544">
    <circle cx="16" cy="12" r="2"/>
    <path d="M9.94 8.5 A7 7 0 0 1 22.06 8.5" fill="none" stroke="#F2B544" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
